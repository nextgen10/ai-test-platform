apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-test-ui
  namespace: ai-testing
  labels:
    app: ai-test-ui
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: ai-test-ui
  template:
    metadata:
      labels:
        app: ai-test-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ai-test-ui:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3100
              name: http
          env:
            # Read at server start by next.config.ts rewrites(). The browser only
            # ever talks to this pod; it proxies to the orchestrator in-cluster.
            - name: API_TARGET
              value: "http://ai-test-orchestrator"
            # The browser never holds an orchestrator credential: this
            # proxy attaches it server-side. Must match an API_TOKENS entry.
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orchestrator-auth
                  key: UI_API_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /dashboard
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /dashboard
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        # Next writes its runtime image/render cache; the rootfs is read-only.
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-test-ui
  namespace: ai-testing
spec:
  selector:
    app: ai-test-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30310
  # NodePort so `minikube service` can reach it without an ingress controller.
  # Production would put an ingress or load balancer in front instead.
  type: NodePort
