# Shared artifact volume. Both the orchestrator and every runner Job mount this,
# with the job id as a subPath.
#
# ReadWriteMany is required for a multi-node cluster. If your storage class does
# not offer RWX, switch the artifact layer to object storage (S3/MinIO) and have
# the runner upload on completion instead of writing to a shared mount.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-test-artifacts
  namespace: ai-testing
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  # storageClassName: <your-rwx-class>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-test-hub
  namespace: ai-testing
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
