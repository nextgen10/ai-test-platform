# Shared artifact volume. Both the orchestrator and every runner Job mount this,
# with the job id as a subPath.
#
# ReadWriteMany is required for a multi-node cluster. If your storage class does
# not offer RWX, switch the artifact layer to object storage (S3/MinIO) and have
# the runner upload on completion instead of writing to a shared mount.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-test-artifacts
  namespace: ai-testing
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  # storageClassName: <your-rwx-class>
---
# Copilot credentials. Create the real value out-of-band; never commit a token.
#
#   kubectl -n ai-testing create secret generic copilot-auth \
#     --from-literal=COPILOT_GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN"
#
# For production, source this from an external secret manager (Vault, External
# Secrets Operator) rather than a literal (blueprint §15).
apiVersion: v1
kind: Secret
metadata:
  name: copilot-auth
  namespace: ai-testing
type: Opaque
stringData:
  COPILOT_GITHUB_TOKEN: "REPLACE_ME"
