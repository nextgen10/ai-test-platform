apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-test-orchestrator
  namespace: ai-testing
  labels:
    app: ai-test-orchestrator
spec:
  # Recreate strategy ensures the ReadWriteOnce volume is released by the old pod
  # before the new pod mounts it, preventing multi-attach volume deadlocks.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: ai-test-orchestrator
  template:
    metadata:
      labels:
        app: ai-test-orchestrator
    spec:
      serviceAccountName: ai-test-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: ai-test-orchestrator:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8100
              name: http
          env:
            - name: EXECUTOR
              value: "kubernetes"
            - name: ENGINE
              value: "copilot"
            - name: K8S_NAMESPACE
              value: "ai-testing"
            - name: RUNNER_IMAGE
              value: "ai-test-runner:dev"
            - name: ARTIFACT_ROOT
              value: "/artifacts"
            - name: CORS_ORIGINS
              value: "http://localhost:3100"
            # PostgreSQL is required here: the root filesystem is read-only, so
            # the SQLite fallback has nowhere to write.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: ai-test-artifacts
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-test-orchestrator
  namespace: ai-testing
spec:
  selector:
    app: ai-test-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
