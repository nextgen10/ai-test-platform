# Agent Hub Registry
#
# Master catalog of all onboarded agents, skills, prompts, and workflows.
# This file is auto-generated by the hub registry service but can also be
# edited manually. The service reconciles file-system contents with this
# manifest on startup.

version: "1.0"
last_updated: "2026-08-26"

# Default model for GHCP CLI invocations when not overridden per-request.
default_model: null

# Available agent categories for grouping in the registry UI.
categories:
  - id: testing
    name: Testing & QA
    icon: flask-conical
  - id: document-intelligence
    name: Document Intelligence
    icon: file-search
  - id: code-quality
    name: Code Quality
    icon: shield-check
  - id: analysis
    name: Analysis & Summarization
    icon: brain
  - id: general
    name: General Purpose
    icon: bot

# Agents are discovered from agent-hub/agents/*.agent.md
# Skills are discovered from agent-hub/skills/*/SKILL.md
# Prompts are discovered from agent-hub/prompts/*.prompt.md
# Workflows are discovered from agent-hub/workflows/*.workflow.yaml
